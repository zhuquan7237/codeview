# https://docs.devin.ai/onboard-devin/environment-yaml
# One-time setup (e.g., install system tools, global CLIs).
initialize:
  - name: ensure JDK 17
    run: |
      java -version 2>&1 | grep -q 'version "17' || (sudo apt-get update && sudo apt-get install -y openjdk-17-jdk-headless)
  - name: install Android SDK (cmdline-tools, platform-tools, platform 35, build-tools 34)
    run: |
      export ANDROID_HOME=$HOME/android-sdk
      if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
        mkdir -p "$ANDROID_HOME/cmdline-tools"
        curl -sSLo /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        rm -rf /tmp/clt && unzip -qo /tmp/clt.zip -d /tmp/clt
        mv /tmp/clt/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
        rm -rf /tmp/clt /tmp/clt.zip
      fi
      yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
      "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;34.0.0" > /dev/null
      echo "ANDROID_HOME=$ANDROID_HOME" >> $ENVRC
      echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $ENVRC
      echo "PATH=$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH" >> $ENVRC
# Install project dependencies (runs during builds, surfaced to agent at session start).
maintenance:
  - name: download Gradle wrapper and dependencies
    run: bash ./gradlew :app:dependencies --configuration debugRuntimeClasspath --console=plain -q > /dev/null
knowledge:
  - name: build
    contents: |
      bash ./gradlew :app:assembleDebug     # app/build/outputs/apk/debug/app-debug.apk
      bash ./gradlew :app:assembleRelease   # R8-minified, debug-signed, ~1.1 MB
  - name: test
    contents: |
      bash ./gradlew :app:testDebugUnitTest   # JVM unit tests (63)
      bash ./gradlew :app:connectedAndroidTest  # needs a running emulator/device (adb devices)
  - name: notes
    contents: |
      gradlew is not executable in git and README uses gradlew.bat (Windows); on Linux run `bash ./gradlew`.
      scripts/release.sh is a Windows-path, SSH-to-mirror release script; don't run it in Devin.
